{{ $url := .Permalink | absLangURL }}
{{ $title := .Title }}
{{ $text := printf "%s %s" $title $url }}
<nav class="share-buttons" aria-label="Compartilhar este post">
  <span class="share-buttons-label">Compartilhar:</span>
  <ul class="share-buttons-list">
    <li>
      <a
        href="https://twitter.com/intent/tweet?text={{ $text | urlquery }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Compartilhar no X"
        title="Compartilhar no X"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M18.244 2H21.5l-7.55 8.62L23 22h-6.83l-5.36-7.01L4.66 22H1.4l8.08-9.22L1 2h6.99l4.84 6.4L18.244 2zm-2.39 18h2.05L7.27 4H5.1l10.755 16z"/></svg>
      </a>
    </li>
    <li>
      <a
        href="https://www.linkedin.com/sharing/share-offsite/?url={{ $url | urlquery }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Compartilhar no LinkedIn"
        title="Compartilhar no LinkedIn"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M19 3a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h14zM8.34 18.34V10.4H5.67v7.94h2.67zM7 9.27a1.55 1.55 0 100-3.1 1.55 1.55 0 000 3.1zM18.34 18.34V14c0-2.34-1.25-3.43-2.92-3.43-1.34 0-1.94.74-2.27 1.26V10.4h-2.66c.04.75 0 7.94 0 7.94h2.66v-4.43c0-.24.02-.48.09-.65.2-.48.64-.98 1.39-.98.98 0 1.37.74 1.37 1.83v4.23h2.66z"/></svg>
      </a>
    </li>
    <li>
      <a
        href="https://bsky.app/intent/compose?text={{ $text | urlquery }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Compartilhar no Bluesky"
        title="Compartilhar no Bluesky"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M6.34 4.86C8.91 6.79 11.69 10.7 12 12.78c.31-2.08 3.09-5.99 5.66-7.92C19.1 3.78 21 2.99 21 5.13c0 .43-.25 3.6-.4 4.12-.5 1.79-2.32 2.25-3.95 1.97 2.85.49 3.58 2.1 2 3.71-3 3.06-4.32-.77-4.66-1.75-.06-.18-.09-.27-.09-.2 0-.07-.03.02-.09.2-.34.98-1.66 4.81-4.66 1.75-1.58-1.61-.85-3.22 2-3.71-1.63.28-3.45-.18-3.95-1.97-.15-.52-.4-3.69-.4-4.12 0-2.14 1.9-1.35 3.34-.27z"/></svg>
      </a>
    </li>
    <li>
      <button
        type="button"
        class="share-copy"
        data-url="{{ $url }}"
        aria-label="Copiar link"
        title="Copiar link"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>
      </button>
    </li>
  </ul>
</nav>
<script>
  (function () {
    const btn = document.currentScript.previousElementSibling.querySelector('.share-copy');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      const url = btn.dataset.url || window.location.href;
      try {
        await navigator.clipboard.writeText(url);
      } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
      }
      btn.classList.add('copied');
      const orig = btn.getAttribute('aria-label');
      btn.setAttribute('aria-label', 'Link copiado!');
      btn.setAttribute('title', 'Link copiado!');
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.setAttribute('aria-label', orig);
        btn.setAttribute('title', orig);
      }, 1800);
    });
  })();
</script>
